name: sync-notices

on:
  schedule:
    # 每天 3 次（UTC）：08:00 / 13:00 / 22:00 ≈ 北京时间 16:00 / 21:00 / 06:00
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
  # 改了抓取配置/脚本就立刻跑一次，不用等定时任务
  push:
    paths:
      - 'tools/notice-sync/*.mjs'
      - 'tools/notice-sync/*.json'
      - '.github/workflows/sync-notices.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 同一时间只跑一个同步，避免两次抓取互相把对方的提交顶掉
    concurrency:
      group: sync-notices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parser unit tests
        run: node --test tools/notice-sync/fetch.test.mjs

      - name: Fetch notices
        run: node tools/notice-sync/fetch.mjs

      - name: Commit if changed (GitHub)
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "当前分支: $(git rev-parse --abbrev-ref HEAD) / HEAD: $(git rev-parse --short HEAD)"

          git add tools/notice-sync/out/notices.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(notices): sync $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "本次提交: $(git log --oneline -1)"

          # 用 HEAD:main 而不是裸 git push：schedule 事件下可能是游离 HEAD。
          # 手动推送撞车时（远端已前进），拉一次再合，冲突以本地数据为准。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ 已推送（第 $i 次尝试）"
              exit 0
            fi
            echo "⚠️ push 第 $i 次失败，尝试同步远端后重试"
            # 浅克隆下直接 --depth=1 拉会变成「无共同祖先」，先补齐历史
            git fetch --unshallow origin main || git fetch origin main || true
            git merge --no-edit -X ours FETCH_HEAD || true
            sleep 5
          done
          echo "❌ 推送失败，诊断信息："
          git status
          git log --oneline -3
          exit 1

      # 同步到 Gitee 的 lit-Calendar 仓库（和校历放一起，作为国内数据源）
      # 需要仓库 Secret: GITEE_TOKEN
      - name: Mirror to Gitee (lit-Calendar)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        if: ${{ env.GITEE_TOKEN != '' }}
        run: |
          set -e
          WORK="$RUNNER_TEMP/cal-mirror"
          rm -rf "$WORK"
          git clone --depth 1 "https://oauth2:${GITEE_TOKEN}@gitee.com/extrisha/lit-Calendar.git" "$WORK"

          # 只替换通知数据，校历文件原样保留
          cp "${GITHUB_WORKSPACE}/tools/notice-sync/out/notices.json" "$WORK/notices.json"

          cd "$WORK"
          git config user.name  "litang-bot"
          git config user.email "extrisha@users.noreply.github.com"
          git add notices.json
          if git diff --quiet --cached; then
            echo "Gitee 侧没有变化，跳过"
          else
            git commit -m "chore(notices): sync from GitHub Actions ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "✅ 已同步到 gitee:extrisha/lit-Calendar"
          fi
